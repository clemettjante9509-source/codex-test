<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初一高效作业批改与提分</title><link rel="stylesheet" href="/style.css"></head><body><main>
<h1>初一高效作业批改 & 提分</h1><p>优先抓得分逻辑，减少无效学习，降低背诵压力。</p>
<p class="notice" id="usage-notice">开放题需要教师采分点或模型辅助。预评分须核对；本工具不承诺满分准确率。勿输入姓名等个人信息。</p>
<section><form id="grade-form"><div class="row"><label>科目<select id="subject"><option>数学</option><option>语文</option><option>英语</option><option>地理</option><option>生物</option><option selected>历史</option><option>道德与法治</option></select></label><label>方式<select id="mode"><option value="rubric">采分点辅助（待复核）</option><option value="exact">客观题精确比对</option><option value="model">模型辅助（需服务器密钥）</option></select></label></div>
<label>原题<textarea id="question" required maxlength="12000" rows="3"></textarea></label><label>学生答案<textarea id="answer" required maxlength="12000" rows="3"></textarea></label>
<details open><summary>评分依据（开放题建议由教师填写）</summary><label>教材版本 / 章节 / 考点<input id="chapter" placeholder="如：七年级上册·战国时期的社会变化·商鞅变法"></label><label>参考答案<textarea id="reference" rows="2"></textarea></label><label>采分点 JSON<textarea id="points" rows="4" placeholder='[{"text":"奖励耕织","keywords":["奖励耕织","奖励耕种"],"score":2}]'></textarea></label><small>每条应是一个独立得分点；keywords 是同义替代表达，命中任意一个仅表示覆盖。复合要点请拆开。</small><label>变式题（可选；不填则生成答题角度练习）<input id="variant-q"></label><label>变式答案<input id="variant-a"></label><label>变式采分点<input id="variant-p"></label></details>
<div class="row"><label><input type="checkbox" id="compact"> 精简模式（保留十项结构，压缩讲解）</label><button type="button" id="example">载入历史例题</button><button id="submit" type="submit">开始批改</button></div>
<label>拍照识别（接口预留）<input id="image" type="file" accept="image/*"></label><button type="button" id="ocr">检查 OCR 接口</button></form></section>
<section aria-live="polite"><h2>批改报告</h2><p id="message"></p><pre id="report">输入题目后，报告显示在这里。</pre><div id="review" hidden><h3>教师 / 家长复核</h3><div id="earned"></div><label>结果<select id="verdict"><option>正确</option><option>部分得分</option><option>错误</option></select></label><label>错误类型<select id="error-type"><option value="">正确题无需归类</option><option value="A">A 审题失误</option><option value="B">B 概念不理解</option><option value="C">C 答题框架缺失</option><option value="D">D 计算/书写粗心</option></select></label><button id="confirm">确认评分并更新错题本</button></div></section>
<section><h2>精简错题本</h2><div class="row"><label>科目<select id="filter-subject"><option value="">全部</option><option>数学</option><option>语文</option><option>英语</option><option>地理</option><option>生物</option><option>历史</option><option>道德与法治</option></select></label><label>考点<input id="filter-chapter" placeholder="完整考点名称"></label><label>错误类型<select id="filter-error"><option value="">全部</option><option value="A">A 审题失误</option><option value="B">B 概念不理解</option><option value="C">C 答题框架缺失</option><option value="D">D 计算/书写粗心</option></select></label><label><input type="checkbox" id="confirmed-only">只看已确认</label></div><button id="refresh">筛选 / 刷新</button> <a id="export" href="/api/export" download>导出考点 + 变式题</a><div id="errors"></div></section>
</main><script src="/app.js"></script></body></html>
